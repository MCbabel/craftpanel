<h1 class="mc-title" style="margin: 0 0 12px 0; font-size: 28px; line-height: 32px; font-weight: 700; color: #1a202c">
	Your password was changed
</h1>
<p class="mc-text" style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #2c2e31">
	Hi <span class="no-auto-link">{{username}}</span>,
</p>
<p class="mc-text" style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #2c2e31">
	The password of your account on this panel was changed on {{when}}. Every other session was
	signed out.
</p>
<p class="mc-muted" style="margin: 0; font-size: 13px; line-height: 16px; color: #484d54">
	If that was not you, tell whoever runs the panel at once — write to
	<span class="no-auto-link">{{contact}}</span>. This mail carries no link, on purpose.
</p>
