<h1 class="mc-title" style="margin: 0 0 12px 0; font-size: 28px; line-height: 32px; font-weight: 700; color: #1a202c">
	Confirm your email address
</h1>
<p class="mc-text" style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #2c2e31">
	Hi <span class="no-auto-link">{{username}}</span>,
</p>
<p class="mc-text" style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #2c2e31">
	Somebody signed up for an account on this panel with your address. Confirm it and the sign-up
	goes on. The link is good for {{valid_for}}.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 8px 0 16px 0">
	<tr>
		<td class="mc-btn" align="center" style="background-color: #00af5c; border-radius: 12px">
			<a
				href="{{action_url}}"
				target="_blank"
				style="display: inline-block; padding: 12px 16px; font-size: 14px; font-weight: 700; color: #ffffff; text-decoration: none"
				>Confirm email address</a
			>
		</td>
	</tr>
</table>
<p class="mc-muted" style="margin: 0; font-size: 13px; line-height: 16px; color: #484d54">
	If it was not you, ignore this mail. Nothing happens without the link above.
</p>
