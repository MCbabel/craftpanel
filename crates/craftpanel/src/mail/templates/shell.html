<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<meta name="supported-color-schemes" content="light dark" />
		<meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no" />
		<title>{{subject}}</title>
		<style>
			.ExternalClass {
				width: 100%;
			}
			.ExternalClass p,
			.ExternalClass span,
			.ExternalClass font,
			.ExternalClass td {
				line-height: 100%;
			}
			table {
				border-collapse: separate;
			}
			a:hover {
				text-decoration: underline;
			}
			.no-auto-link,
			.no-auto-link a,
			.no-auto-link a:link,
			.no-auto-link a:visited,
			.no-auto-link a[x-apple-data-detectors] {
				color: inherit !important;
				text-decoration: none !important;
				cursor: default !important;
				pointer-events: none !important;
			}
			@media (max-width: 600px) {
				.mc-pad {
					padding: 20px !important;
				}
				.mc-title {
					font-size: 24px !important;
				}
			}
			@media (prefers-color-scheme: dark) {
				.mc-bg {
					background-color: #16181c !important;
				}
				.mc-card {
					background-color: #27292e !important;
				}
				.mc-line {
					border-top-color: #34363c !important;
				}
				.mc-title {
					color: #ffffff !important;
				}
				.mc-text {
					color: #b0bac5 !important;
				}
				.mc-muted {
					color: #96a2b0 !important;
				}
				.mc-brand {
					color: #1bd96a !important;
				}
				.mc-btn {
					background-color: #1bd96a !important;
				}
				.mc-btn a {
					color: #000000 !important;
				}
				.mc-link,
				.mc-link a {
					color: #4f9cff !important;
				}
			}
		</style>
	</head>
	<body
		class="mc-bg"
		style="margin: 0; padding: 0; background-color: #ebebeb; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
	>
		<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
			{{preheader}}
			&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;&#847;&zwnj;
		</div>

		<table
			role="presentation"
			class="mc-bg"
			width="100%"
			cellpadding="0"
			cellspacing="0"
			border="0"
			style="background-color: #ebebeb"
		>
			<tr>
				<td align="center" style="padding: 16px">
					<table
						role="presentation"
						width="600"
						cellpadding="0"
						cellspacing="0"
						border="0"
						style="width: 100%; max-width: 600px"
					>
						<tr>
							<td style="padding: 8px 4px 16px 4px">
								<span
									class="mc-brand"
									style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em; color: #00af5c"
									>craftpanel</span
								>
							</td>
						</tr>
						<tr>
							<td
								class="mc-card mc-pad"
								style="background-color: #f8f8f8; border-radius: 12px; padding: 32px"
							>
								{{body}}
							</td>
						</tr>
						<tr>
							<td style="padding: 24px 4px 8px 4px">
								<div
									class="mc-line"
									style="border-top: 1px solid #dddddd; font-size: 0; line-height: 0"
								>
									&nbsp;
								</div>
								<p
									class="mc-muted"
									style="margin: 16px 0 0 0; font-size: 12px; line-height: 18px; color: #484d54"
								>
									{{footer}}
								</p>
								{{manual_link}}
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
