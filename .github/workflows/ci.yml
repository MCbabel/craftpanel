name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-branding.sh
      - run: python3 scripts/comments-test.py
      - run: scripts/check-no-comments.sh

  interface:
    name: interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @craftpanel/web test
      - run: scripts/check-types.sh
      - run: pnpm --filter @craftpanel/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  panel:
    name: panel
    needs: interface
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p craftpanel-proto
      - run: cargo test -p craftpanel-helper
      - name: cargo test -p craftpanel
        run: |
          set -o pipefail
          cargo test -p craftpanel 2>&1 | tee /tmp/panel-tests.log
        continue-on-error: true
        id: panel_tests
      - name: what failed
        if: steps.panel_tests.outcome == 'failure'
        run: |
          {
            echo '```'
            sed -n '/^failures:/,$p' /tmp/panel-tests.log | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
