name: CI

# The checks every change has to pass, and the same ones every release has to pass:
# release.yml calls this file with `uses: ./.github/workflows/ci.yml`, so a tag goes
# through this list and not through a second copy of it that drifts away from it.
#
# Every action below is pinned to a full commit SHA with the version beside it. A tag
# or a branch is whatever its owner points it at today — that is how a change to
# tj-actions/changed-files emptied the secrets of thousands of repositories in an
# afternoon — and these jobs build the binary a stranger installs as root. How to move
# a pin is in CONTRIBUTING.md, under "Releasing".

on:
  push:
    branches: [main]
  pull_request:
  # Tags are deliberately not listed: release.yml calls this workflow, so a tag runs
  # these jobs once, inside the release run, on the tagged commit.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# In a called workflow `github.workflow` is the caller's name, so the run inside a
# release ("release") cannot cancel the run of a branch or a pull request ("CI") that
# happens to sit on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/check-no-branding.sh
      - run: python3 scripts/comments-test.py
      - run: scripts/check-no-comments.sh
      - run: scripts/check-shell.sh
      - run: python3 scripts/check-doc-lines.py

  interface:
    name: interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm moved the v4 tag back to v4.3.0 after v4.4.0 turned out to need Node 24,
      # so this SHA is what `@v4` runs today, not the newest tag in the v4 line.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @craftpanel/web test
      - run: scripts/check-types.sh
      - run: pnpm --filter @craftpanel/web build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  panel:
    name: panel
    needs: interface
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist
      # The `stable` branch of this action, as it stood on 2026-08-05. The SHA pins the
      # action, not the compiler: it asks rustup for whatever stable is on the day, which
      # is 1.98.0 now, and Cargo.toml asks for 1.85 or newer. Pull the pin forward when
      # the action gains something, not when Rust does.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p craftpanel-proto
      - run: cargo test -p craftpanel-helper
      - name: cargo test -p craftpanel
        run: |
          set -o pipefail
          cargo test -p craftpanel 2>&1 | tee /tmp/panel-tests.log
        continue-on-error: true
        id: panel_tests
      - name: what failed
        if: steps.panel_tests.outcome == 'failure'
        run: |
          {
            echo '```'
            sed -n '/^failures:/,$p' /tmp/panel-tests.log | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(thread '|----? |    [a-z_]+::)" /tmp/panel-tests.log \
            | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1
